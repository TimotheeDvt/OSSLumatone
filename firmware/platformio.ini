; PlatformIO Project Configuration File
;
; One Raspberry Pi Pico per 56-key section. Every section runs the same code;
; only SECTION_INDEX changes (it picks the MIDI channel and the USB name).
;
;   pio run -e section1 -t upload
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags =
    -DUSE_TINYUSB
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    fortyseveneffects/MIDI Library @ ^5.0.2
monitor_speed = 115200

[env:section1]
build_flags = ${env.build_flags} -DSECTION_INDEX=0

[env:section2]
build_flags = ${env.build_flags} -DSECTION_INDEX=1

[env:section3]
build_flags = ${env.build_flags} -DSECTION_INDEX=2

[env:section4]
build_flags = ${env.build_flags} -DSECTION_INDEX=3

[env:section5]
build_flags = ${env.build_flags} -DSECTION_INDEX=4

; 6-key perfboard prototype: 1 x 74HC4051, no LEDs (hardware/hex_prototype_6key.scad)
[env:prototype6]
build_flags = ${env.build_flags} -DSECTION_INDEX=0 -DPROTOTYPE_6KEY
